<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm 原型</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #f0efea; --line: #e2e0d8;
  --text: #1d1d1b; --muted: #6b6a64; --faint: #9a988f;
  --accent: #2f5bd3; --accent-soft: #e6ecfb;
  --ok: #1c7a44; --ok-soft: #e3f3ea; --warn: #995b00; --warn-soft: #fbf0dc;
  --bad: #c0392b; --bad-soft: #fbe6e3; --agent: #7a4fc4; --agent-soft: #efe8fa;
  --on-accent: #ffffff; --on-ok: #ffffff; --on-bad: #ffffff;
  --overlay: #00000066;
  --flow-label: #605e57;
  --graph-bg: #f6f6f3; --graph-node-bg: #ffffff; --graph-text: #1d1d1b; --graph-muted: #6b6a64;
  --graph-line: #46453f; --graph-active: #2f5bd3; --graph-return: #c0392b; --graph-discovery: #7a4fc4;
  --graph-label: #605e57; --graph-label-bg: #f0efea;
  --result-pass: #005b70; --result-pass-bg: #dff3f7;
  --result-fail: #8b2357; --result-fail-bg: #fae6f0;
  --result-unverifiable: #55429b; --result-unverifiable-bg: #efebfa;
  --result-unprocessed: #55565f; --result-unprocessed-bg: #ececf0;
  --preview-text: #1d1d1b; --preview-bg: #ffffff; --preview-muted: #6b6a64; --preview-code-bg: #f0efea;
  --preview-highlight: #2346a6; --preview-highlight-bg: #e6ecfb;
  --preview-add: #165c33; --preview-add-bg: #e3f3ea; --preview-delete: #9b2c21; --preview-delete-bg: #fbe6e3;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --panel-2: #282825; --line: #34332f;
    --text: #ecebe6; --muted: #a3a197; --faint: #75736b;
    --accent: #7c9cf0; --accent-soft: #232c45;
    --ok: #5cc48a; --ok-soft: #1d3326; --warn: #e3a64a; --warn-soft: #3a2d17;
    --bad: #ef7d70; --bad-soft: #3d2220; --agent: #b598ea; --agent-soft: #2e2540;
    --on-accent: #161615; --on-ok: #161615; --on-bad: #161615;
    --overlay: #00000099;
    --flow-label: #c0beb5;
    --graph-bg: #161615; --graph-node-bg: #1f1f1d; --graph-text: #ecebe6; --graph-muted: #a3a197;
    --graph-line: #cccac2; --graph-active: #7c9cf0; --graph-return: #ef7d70; --graph-discovery: #b598ea;
    --graph-label: #c0beb5; --graph-label-bg: #282825;
    --result-pass: #73d5e7; --result-pass-bg: #18343b;
    --result-fail: #ffa0ca; --result-fail-bg: #412337;
    --result-unverifiable: #c1b1ff; --result-unverifiable-bg: #302842;
    --result-unprocessed: #c1c2ce; --result-unprocessed-bg: #2b2c33;
    --preview-text: #ecebe6; --preview-bg: #1f1f1d; --preview-muted: #a3a197; --preview-code-bg: #282825;
    --preview-highlight: #a6bcff; --preview-highlight-bg: #232c45;
    --preview-add: #7edba6; --preview-add-bg: #1d3326; --preview-delete: #ff9b90; --preview-delete-bg: #3d2220;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
a { color: var(--muted); }
body { background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; }
button:hover { border-color: var(--faint); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
button.bad { color: var(--bad); }
button.small { padding: 3px 9px; font-size: 12px; }
button:disabled { cursor: not-allowed; opacity: .5; }
select { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; background: var(--panel); color: var(--text); }
textarea, input[type=text] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--panel); color: var(--text); }
textarea { resize: vertical; min-height: 60px; }

.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 10px; }
main { overflow-y: auto; padding: 22px 28px 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 2px 8px 14px; }
.brand small { font-weight: 400; color: var(--faint); font-size: 12px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.nav-item:hover { background: var(--panel-2); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.count { background: var(--bad); color: var(--on-bad); border-radius: 10px; font-size: 11px; padding: 0 7px; font-weight: 600; }
.section-label { font-size: 11px; color: var(--faint); letter-spacing: .06em; padding: 16px 10px 6px; }
.tree-node { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.tree-node:hover { background: var(--panel-2); }
.tree-node.active { background: var(--accent-soft); }
.tree-node .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.s-draft { background: var(--panel-2); color: var(--muted); } .d-draft { background: var(--faint); }
.s-ready { background: var(--accent-soft); color: var(--accent); } .d-ready { background: var(--accent); }
.s-running { background: var(--agent-soft); color: var(--agent); } .d-running { background: var(--agent); }
.s-blocked { background: var(--warn-soft); color: var(--warn); } .d-blocked { background: var(--warn); }
.s-verifying { background: var(--agent-soft); color: var(--agent); } .d-verifying { background: var(--agent); }
.s-in_review { background: var(--warn-soft); color: var(--warn); } .d-in_review { background: var(--warn); }
.s-changes_requested { background: var(--bad-soft); color: var(--bad); } .d-changes_requested { background: var(--bad); }
.s-accepted { background: var(--ok-soft); color: var(--ok); } .d-accepted { background: var(--ok); }
.s-abandoned { background: var(--panel-2); color: var(--muted); } .d-abandoned { background: var(--faint); }
.k { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.who-agent { color: var(--agent); } .who-human { color: var(--accent); }

h1 { font-size: 21px; margin: 4px 0 6px; }
h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .hint { font-weight: 400; font-size: 12px; color: var(--faint); }
.crumb { color: var(--faint); font-size: 12px; }
.crumb a { color: var(--muted); cursor: pointer; text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; }
.banner.warn { background: var(--warn-soft); }
.banner.agent { background: var(--agent-soft); }
.banner.ok { background: var(--ok-soft); }
.banner.neutral { background: var(--panel-2); color: var(--muted); }
.banner .grow { flex: 1; }
.banner b { display: block; margin-bottom: 2px; }

.cols { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.col-label { font-size: 11px; letter-spacing: .08em; color: var(--faint); margin-bottom: 4px; }
.need { white-space: pre-wrap; }
.row { padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: none; }
.row-top { display: flex; gap: 8px; align-items: flex-start; }
.row-top .grow { flex: 1; }
.src { font-size: 11px; color: var(--faint); margin-top: 2px; }
.unconfirmed { background: var(--warn-soft); margin: 0 -8px; padding: 9px 8px; border-radius: 6px; }

.verdict { font-size: 12px; font-weight: 600; white-space: nowrap; }
.v-pass { color: var(--ok); } .v-fail { color: var(--bad); } .v-unchecked { color: var(--faint); }
.v-unresolved { color: var(--warn); }
details.ev { margin-top: 6px; }
details.ev summary { font-size: 12px; color: var(--muted); cursor: pointer; }
.ev-item { margin: 6px 0 0 4px; padding: 7px 10px; background: var(--panel-2); border-radius: 6px; font-size: 12.5px; }
.ev-item code { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
.ev-item .by { font-size: 11px; color: var(--faint); }

.change { border: 1px dashed var(--warn); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); margin-bottom: 14px; }
.diff { font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
.diff .add { color: var(--ok); } .diff .del { color: var(--bad); }

.below { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
details.process > summary { cursor: pointer; list-style: none; }
details.process > summary::-webkit-details-marker { display: none; }
.tl { margin-top: 10px; }
.tl-item { display: grid; grid-template-columns: 52px 92px 1fr; gap: 8px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--line); }
.tl-item .time { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
.kid { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; }
.kid:first-child { border-top: none; }
.kid:hover .t { color: var(--accent); }
.kid .t { flex: 1; }

.inbox-group { margin-bottom: 22px; }
.inbox-item { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.inbox-item:hover { border-color: var(--faint); }
.inbox-item .grow { flex: 1; min-width: 0; }
.inbox-item .sub { font-size: 12px; color: var(--muted); }
.impact { font-size: 11px; color: var(--bad); white-space: nowrap; }
.empty { color: var(--faint); font-size: 13px; padding: 4px 2px 10px; }
.intro { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 22px; font-size: 13px; color: var(--muted); }
.intro b { color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.toast { position: fixed; z-index: 20; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.add-row { display: flex; gap: 6px; margin-top: 10px; }
.add-row input { flex: 1; min-width: 0; }
.add-row select, .add-row button { flex: none; }
.info-band { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 18px; margin-bottom: 16px; }
.info-band > div, .cols > div, .below > div { min-width: 0; overflow-wrap: anywhere; }
.info-band ul, .handoff ul { padding-left: 18px; margin: 4px 0 10px; }
.limit-row { margin-top: 6px; font-size: 12px; }
.limit-row .meta { justify-content: space-between; }
.progress { height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin-top: 4px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.limit-row.warning { color: var(--warn); } .limit-row.warning .progress span { background: var(--warn); }
.limit-row.exhausted { color: var(--bad); } .limit-row.exhausted .progress span { background: var(--bad); }
.handoff { grid-column: 1 / -1; }
.handoff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin-top: 10px; }
.tabs { display: flex; gap: 6px; margin: 12px 0 8px; }
.tabs .active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.attempt { margin-top: 8px; padding: 10px; background: var(--panel-2); border-radius: 7px; }
.attempt.failed { border-left: 3px solid var(--bad); background: var(--bad-soft); }
.attempt.limited { border-left: 3px solid var(--warn); }
.attempt .reason { margin-top: 6px; color: var(--bad); font-size: 12px; }
.check { margin-top: 5px; }
.resolution { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.action-hint { width: 100%; text-align: right; color: var(--warn); font-size: 12px; }
.modal-backdrop { position: fixed; inset: 0; z-index: 10; background: var(--overlay); display: grid; place-items: center; padding: 20px; }
.modal { width: min(820px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.modal h2 { justify-content: space-between; flex-wrap: wrap; }
.prompt-preview { margin: 6px 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; font: 12px/1.65 var(--mono); }
[hidden] { display: none !important; }

.app > *, .form-grid > * { min-width: 0; }
main, .card, .head, .modal { overflow-wrap: anywhere; }
.nav-button { width: 100%; text-align: left; border-color: transparent; background: transparent; }
.side-project { margin: 8px 0; }
.side-project > summary { cursor: pointer; padding: 6px 10px; font-size: 13px; overflow-wrap: anywhere; }
.side-project .tree-node { padding-left: 22px; }
.side-note { padding: 12px 10px; }
.inbox-button { width: 100%; text-align: left; }
.inbox-button .sub { display: block; }
.s-pending_approval { background: var(--warn-soft); color: var(--warn); }
.s-waiting, .s-skipped { background: var(--panel-2); color: var(--muted); }
.s-needs_revalidation { background: var(--bad-soft); color: var(--bad); }
.d-pending_approval { background: var(--warn); }
.d-waiting, .d-skipped { background: var(--faint); }
.d-needs_revalidation { background: var(--bad); }
.flow-diagram { margin: 20px 0; min-width: 0; }
.flow-canvas { max-width: 100%; overflow-x: auto; background: var(--graph-bg); padding: 2px; }
.flow-svg { display: block; background: var(--graph-bg); max-width: none; }
.flow-node { background: var(--graph-node-bg); color: var(--graph-text); cursor: pointer; outline: none; }
.flow-node .src { color: var(--muted); }
.flow-node-box { fill: var(--graph-node-bg); stroke: var(--graph-line); stroke-width: 1.5; }
.flow-node.discovery .flow-node-box { stroke: var(--graph-discovery); stroke-dasharray: 6 4; }
.flow-node:hover .flow-node-box, .flow-node:focus .flow-node-box, .flow-node.current .flow-node-box { stroke: var(--graph-active); stroke-width: 3; }
.flow-title { fill: var(--graph-text); font-size: 14px; font-weight: 600; }
.flow-agent { fill: var(--graph-muted); font-size: 12px; }
.flow-discovery-tag { fill: var(--graph-discovery); font-size: 12px; }
.flow-state-text { font-size: 12px; }
.flow-state.s-draft .flow-state-text, .flow-state.s-waiting .flow-state-text, .flow-state.s-skipped .flow-state-text, .flow-state.s-abandoned .flow-state-text { fill: var(--muted); }
.flow-state.s-draft .flow-state-bg, .flow-state.s-waiting .flow-state-bg, .flow-state.s-skipped .flow-state-bg, .flow-state.s-abandoned .flow-state-bg { fill: var(--panel-2); }
.flow-state.s-ready .flow-state-text { fill: var(--accent); }
.flow-state.s-ready .flow-state-bg { fill: var(--accent-soft); }
.flow-state.s-running .flow-state-text, .flow-state.s-verifying .flow-state-text { fill: var(--agent); }
.flow-state.s-running .flow-state-bg, .flow-state.s-verifying .flow-state-bg { fill: var(--agent-soft); }
.flow-state.s-blocked .flow-state-text, .flow-state.s-pending_approval .flow-state-text, .flow-state.s-in_review .flow-state-text { fill: var(--warn); }
.flow-state.s-blocked .flow-state-bg, .flow-state.s-pending_approval .flow-state-bg, .flow-state.s-in_review .flow-state-bg { fill: var(--warn-soft); }
.flow-state.s-changes_requested .flow-state-text, .flow-state.s-needs_revalidation .flow-state-text { fill: var(--bad); }
.flow-state.s-changes_requested .flow-state-bg, .flow-state.s-needs_revalidation .flow-state-bg { fill: var(--bad-soft); }
.flow-state.s-accepted .flow-state-text { fill: var(--ok); }
.flow-state.s-accepted .flow-state-bg { fill: var(--ok-soft); }
.flow-edge-path { fill: none; stroke: var(--graph-line); stroke-width: 2; stroke-linejoin: round; }
.flow-edge.returned .flow-edge-path { stroke: var(--graph-return); stroke-dasharray: 8 5; }
.flow-edge.discovery .flow-edge-path { stroke: var(--graph-discovery); stroke-dasharray: 2 5; }
.flow-edge.returned.discovery .flow-edge-path { stroke: var(--graph-return); stroke-dasharray: 8 4 2 4; }
.flow-edge.is-dim .flow-edge-path { opacity: .75; }
.flow-edge.is-active .flow-edge-path { stroke: var(--graph-active); stroke-width: 3; marker-end: var(--graph-arrow-active); }
.flow-arrow-normal { fill: var(--graph-line); }
.flow-arrow-returned { fill: var(--graph-return); }
.flow-arrow-discovery { fill: var(--graph-discovery); }
.flow-arrow-active { fill: var(--graph-active); }
.flow-edge-label { fill: var(--graph-label); font-size: 12px; }
.flow-label-bg { fill: var(--graph-label-bg); }
.flow-legend { display: flex; gap: 6px 14px; flex-wrap: wrap; align-items: center; margin-top: 10px; color: var(--graph-label); background: var(--graph-bg); font-size: 12px; }
.flow-legend > span { display: inline-flex; align-items: center; gap: 5px; }
.flow-legend svg { width: 32px; height: 12px; flex: none; }
.flow-legend-return { stroke: var(--graph-return); stroke-width: 2; stroke-dasharray: 8 5; }
.flow-legend-discovery { fill: var(--graph-node-bg); stroke: var(--graph-discovery); stroke-width: 2; stroke-dasharray: 3 3; }
.flow-local h2 { margin-bottom: 4px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
.flow-editor { margin-top: 18px; }
.flow-editor summary { cursor: pointer; }
.form-card { margin-top: 18px; }
.form-card label, .flow-editor label, details.handoff label, .form-grid label { display: block; margin: 10px 0; }
.form-card label select, .flow-editor label select, details.handoff select { width: 100%; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-card fieldset { border: 1px solid var(--line); border-radius: 7px; margin: 14px 0; }
.form-card .seat-option { display: inline-flex; gap: 4px; margin: 5px 12px 5px 0; }
.seat-isolation { margin-left: 8px; }
.dependency-band { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.version-diff { margin-bottom: 14px; }
.autonomy-row { display: flex !important; justify-content: space-between; gap: 10px; align-items: center; padding: 6px 0; }
.autonomy-row select { width: auto !important; flex: none; }
.node-editor { overflow-y: auto; min-height: 0; }
.node-editor label { display: block; margin: 10px 0; }
.node-editor select { max-width: 100%; }

@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .below { grid-template-columns: 1fr; } .info-band { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: none; border-bottom: 1px solid var(--line); max-height: 45vh; }
  main { padding: 16px; }
  .head { flex-direction: column; }
  .actions { justify-content: flex-start; }
  .action-hint { text-align: left; }
  .handoff-grid { grid-template-columns: 1fr; }
  .add-row { flex-wrap: wrap; }
  .add-row input { flex-basis: 100%; }
  .inbox-item { position: relative; flex-wrap: wrap; justify-content: flex-start; align-items: flex-start; row-gap: 8px; }
  .inbox-item > .dot { position: absolute; top: 19px; left: 14px; }
  .inbox-item > .grow { flex: 0 0 100%; padding-left: 20px; overflow-wrap: anywhere; }
  .inbox-item > .impact { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .inbox-item > .chip { flex: none; }
  .modal-backdrop { padding: 12px; }
  .tl-item { grid-template-columns: 46px 1fr; } .tl-item .who { grid-column: 2; }
  .form-grid { grid-template-columns: minmax(0, 1fr); }
  .flow-canvas { overflow-x: hidden; }
  .flow-svg { max-width: 100%; }
  .autonomy-row { flex-wrap: wrap; }
}
.result-pass { color: var(--result-pass); background: var(--result-pass-bg); }
.result-fail { color: var(--result-fail); background: var(--result-fail-bg); }
.result-unverifiable { color: var(--result-unverifiable); background: var(--result-unverifiable-bg); }
.result-unprocessed { color: var(--result-unprocessed); background: var(--result-unprocessed-bg); }

const getNode = (id) => db.nodes[id];
const getProject = (id) => db.projects.find((p) => p.id === id);
const getAgent = (id) => db.agents.find((a) => a.id === id);
const coreTime = () => typeof stamp === 'function' ? stamp() : new Date().toISOString();
const coreId = (prefix) => `${prefix}-${++db.serial}`;
const coreActor = (actor) => actor === 'automatic' || actor === 'auto' ? '自动' : ['leader','agent:leader'].includes(actor) ? 'leader' : '你';
function coreFinish(message) { if (message && typeof toast === 'function') toast(message); if (typeof render === 'function') render(); }
function coreLog(node,actor,text) { if (!node) return; node.log ||= []; node.log.push([coreTime(),getAgent(actor)?actor:coreActor(actor),text]); }
function recordDecision(type,nodeId,text,actor='human',outcome='原样采纳',extra={}) {
  const node=getNode(nodeId);
  const decision={id:coreId('decision'),nodeId:nodeId||null,projectId:node?.projectId||extra.projectId||null,type:AUTONOMY_LABELS[type]||type,title:extra.title||text,text,decisionMaker:coreActor(actor),outcome,time:coreTime(),...extra};
  db.decisions.push(decision); return decision;
}
function coreRefuse(reason,nodeId=null,actor='human',type='规则检查') { recordDecision(type,nodeId,reason,actor,'驳回');coreFinish(reason);return {ok:false,reason}; }
function coreAuto(node,key) { const p=getProject(node.projectId); return db.autonomy[p.type]?.[key] === 'auto'; }

function initV4() {
  if(db.v4Initialized)return;db.v4Initialized=true;
  for(const autonomy of Object.values(db.autonomy))Object.assign(autonomy,{orchestration:'auto',discovery:'human',caution:'auto',designDecision:'human',sideEffect:'human'});
  for(const node of Object.values(db.nodes)){
    normalizeV4Node(node);
    for(const attempt of node.attempts){attempt.cost=v4Money((node.projectId==='project-a'?1.2:2)+(attempt.number-1)*.4);attempt.stepSummary={pass:attempt.result==='success'?1:0,fail:attempt.result==='failed'?1:0,unverifiable:0,unprocessed:attempt.result==='limit'?1:0};}
    node.cost=v4Money(node.attempts.reduce((sum,attempt)=>sum+attempt.cost,0));
  }
  for(const agent of [...db.agents,...db.agentTemplates]){
    agent.mainModel=agent.model;agent.mainStrength=agent.strength;
    agent.stepModel=agent.seats.includes('execute')?agent.model:null;
    agent.stepStrength=agent.seats.includes('execute')?'high':null;
  }
  const patterns=[
    ['single','结构','单步','一个代理调用','小改动','P0',['输入','输出 schema','固定测试','产物范围']],
    ['sequence','结构','顺序','A → B → C','先分析再修改','P0',['顺序步骤','输入输出绑定','失败策略']],
    ['parallel','结构','并行汇总','拆开 → 并行 → 汇总','多维度调研','P0',['分支全集','并发数','汇合策略','缺席项处理']],
    ['batch','结构','批量清单','枚举 → 逐项处理 → 逐项验证','迁移 40 个调用点','P0',['枚举来源','冻结清单','稳定条目 ID','逐项验证']],

function flowStages(p) {

    row.forEach(id=>remaining.delete(id));stages.push(row);
  }
  // 两次重心排序减少分叉/汇合的交叉；相同重心保持原项目顺序。
  const original=new Map(ids.map((id,i)=>[id,i]));

function saveNodeEditor() {

function workerPrompt(id) {
  const c=getNode(id),l=c.limit,h=c.handoff;

  const handoff=h?`更新：${h.updated}\n基线：${h.baseline}\n已完成：${h.done.join('；')}\n决策及依据：${h.decisions.join('；')}\n未解决：${h.open.join('；')}\n下一步：${h.next}\n产出路径：${h.outputs.join('；')}`:'尚未开工，无交接记录；第一步记录基线';
  return `<goal>完成 ${c.need}。在 ${c.deliverable} 留下可用结果、验证证据和交接记录。达到全部测试或上限即停止。</goal>\n<inputs>\nTask: ${c.need}\nOutput: ${c.deliverable}\nChecks: ${checks}\nSources: ${c.sources.join('；')}\nScope: ${scope}\nLimit: 截止 ${l.deadline} / 尝试次数 ${l.usedAttempts}/${l.maxAttempts} / token ${formatNumber(l.usedTokens)}/${formatNumber(l.tokenBudget)}\nHandoff:\n${handoff}\n</inputs>\n<rules>\n- 先读 handoff，再核对其引用的文件，不要直接相信记录的状态\n- 第一步记录基线\n- 不得放宽测试来换取通过；节点项目问题只能通过 propose_change 提出\n- 不得重复已失败的方法，除非有新理由（失败记录摘要：\n${failed}）\n- 每完成一个阶段调用 save_handoff\n- 证据通过 submit_evidence 提交；验证由核对席位完成，你不自评\n</rules>`;
}

function renderStepGraph(c,o) {

function getMergeQueue(projectId) {
  const project=getProject(projectId);
  if(project?.type!=='产品开发')return [];
  return (project.nodeIds||[]).map(getNode).filter(node=>node?.status==='accepted'&&node.merge?.example)
    .sort((a,b)=>a.merge.acceptedOrder-b.merge.acceptedOrder)
    .map(node=>({nodeId:node.id,title:node.title,...node.merge,needsRebase:node.merge.status!=='merged'&&(node.merge.needsRebase||node.merge.baseVersion!==project.mergeBaselineVersion)}));
}
function registerMergeAcceptance(node) {
  const project=getProject(node.projectId);
  if(project?.type!=='产品开发'||!project.exampleMerge||node.status!=='accepted')return;
  if(node.merge&&node.merge.status!=='returned')return;
  project.mergeSerial=(project.mergeSerial||0)+1;
  node.merge={example:true,sourceNote:'示例 · 当前页面模拟合并，未操作真实仓库',acceptedAt:coreTime(),acceptedOrder:project.mergeSerial,status:'pending',baseVersion:node.mergeWorkBaseVersion??project.mergeBaselineVersion,needsRebase:project.mergeSerial>1,leaderAttempts:[],history:[]};
  coreLog(node,'leader','示例 · 按本次验收顺序加入合并队列，合并前先 rebase 到最新基线');
}
function mergePredecessor(nodeId) {
  const node=getNode(nodeId),queue=getMergeQueue(node?.projectId),index=queue.findIndex(item=>item.nodeId===nodeId);
  return index<0?null:queue.slice(0,index).find(item=>item.status!=='merged');
}
function completeExampleMerge(node,actor='leader') {
  const project=getProject(node.projectId),merge=node.merge;
  merge.baseVersion=project.mergeBaselineVersion;merge.needsRebase=false;merge.status='merged';
  merge.mergedAt=coreTime();merge.mergedVersion=++project.mergeBaselineVersion;
  merge.history.push({time:merge.mergedAt,event:'示例 · 合并完成',baseVersion:merge.baseVersion,mergedVersion:merge.mergedVersion,actor:coreActor(actor)});
  coreLog(node,actor,`示例 · 已合并到 main@${merge.mergedVersion}，后续节点需先 rebase 到此基线`);
  return {ok:true,nodeId:node.id,status:merge.status};
}
function failExampleLeaderMerge(node,time=coreTime()) {
  const merge=node.merge,project=getProject(node.projectId);
  // 先写 leader 尝试及失败结果，再将未解决冲突登记为人工待办。
  const attempt={time,actor:'leader',result:'failed',text:'示例 · leader 尝试保留共享接口与搜索参数两侧改动；参数语义仍不一致，无法安全自动解决'};
  merge.leaderAttempts.push(attempt);merge.status='conflict';merge.needsRebase=true;

  node.log ||= [];node.log.push([time,'leader',attempt.text]);
  const conflict={id:node.id==='c-search'&&!db.mergeConflicts.some(item=>item.id==='merge-conflict-c-search')?'merge-conflict-c-search':coreId('merge-conflict'),nodeId:node.id,projectId:node.projectId,title:'示例 · '+node.title.replace(/^示例 · /,'')+'合并冲突',description:'示例 · src/search.js 的共享接口参数存在语义冲突，需要人工选择正确实现',status:'pending',example:true,leaderAttempts:cloneData(merge.leaderAttempts),escalatedAt:time,baseVersion:project.mergeBaselineVersion,sourceNote:'示例 · 未执行真实 rebase 或 git 合并'};
  db.mergeConflicts.push(conflict);
  recordDecision('合并冲突',node.id,'示例 · leader 解决冲突失败，升级到收件箱「合并冲突」','leader','有修改',{conflictId:conflict.id,action:'escalate',example:true});
  return {ok:false,conflict:true,conflictId:conflict.id,reason:'示例 · leader 无法自动解决，等待你处理'};
}
function attemptMerge(nodeId) {
  const node=getNode(nodeId),project=getProject(node?.projectId);
  if(!node||!project?.exampleMerge||node.status!=='accepted'||!node.merge?.example)return {ok:false,reason:'仅可模拟合并示例项目中已验收的节点'};
  if(node.merge.status==='merged')return {ok:false,reason:'示例 · 此节点已合并'};
  if(node.merge.status==='conflict')return {ok:false,reason:'示例 · 请先在合并冲突中选择人工处理方式'};
  const previous=mergePredecessor(nodeId);
  if(previous)return coreRefuse('示例 · 请先处理更早验收的节点：'+previous.title,nodeId,'leader','合并顺序');
  node.merge.history.push({time:coreTime(),event:'示例 · 先 rebase 到最新基线',fromVersion:node.merge.baseVersion,toVersion:project.mergeBaselineVersion});
  if(node.merge.demoConflict&&!node.merge.manuallyResolved){const result=failExampleLeaderMerge(node);coreFinish('示例 · leader 尝试失败，冲突已进入收件箱');return result;}
  const result=completeExampleMerge(node);coreFinish('示例 · 已 rebase 到最新基线并合并');return result;
}
function resolveMergeConflict(id,action,actor='human') {
  const conflict=db.mergeConflicts.find(item=>item.id===id);
  if(!conflict||conflict.status!=='pending')return {ok:false,reason:'没有待处理的示例合并冲突'};
  if(actor!=='human')return coreRefuse('示例 · 合并冲突的人工处理由你决定',conflict.nodeId,actor,'合并冲突');
  if(!['continue','return'].includes(action))return {ok:false,reason:'未知的合并冲突处理方式'};
  const node=getNode(conflict.nodeId);
  if(action==='continue'){
    const previous=mergePredecessor(node.id);if(previous)return coreRefuse('示例 · 请先处理更早验收的节点：'+previous.title,node.id,actor,'合并顺序');
    conflict.status='resolved';node.merge.manuallyResolved=true;node.merge.demoConflict=false;
    node.merge.history.push({time:coreTime(),event:'示例 · 已手动解决，rebase 到最新基线后继续合并',actor:'你'});
    completeExampleMerge(node,actor);
  }else{
    conflict.status='returned';node.mergeHistory ||= [];node.mergeHistory.push(cloneData(node.merge));
    node.merge.status='returned';node.merge.history.push({time:coreTime(),event:'示例 · 退回节点重新处理，保留旧验收与冲突历史',actor:'你'});
    node.status='changes_requested';node.merge.demoConflict=false;invalidateChecks(node);
    updateHandoff(node,'示例 · 人工退回合并冲突，重新处理共享接口后再次提交验收','human');
    coreLog(node,'human','示例 · 退回节点重新处理；旧验收与合并冲突记录保留');
  }
  conflict.action=action;conflict.resolvedBy='你';conflict.resolvedAt=coreTime();
  recordDecision('合并冲突',node.id,'示例 · '+(action==='continue'?'已手动解决，继续合并':'退回节点重新处理'),actor,action==='continue'?'原样采纳':'有修改',{conflictId:id,action,example:true});
  coreFinish(action==='continue'?'示例 · 人工解决后已继续合并':'示例 · 已退回节点，旧验收与冲突历史保留');return {ok:true,conflict,nodeId:node.id};
}
