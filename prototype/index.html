* {box-sizing:border-box;} html,body {margin:0;height:100%;} html {overflow-anchor:none;scroll-behavior:auto;} body {font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}

.nav-item {width:100%;text-align:left;display:flex;gap:8px;justify-content:space-between;border:0;margin:4px 0;padding:9px 10px;} .nav-item.active {background:var(--accent-bg);color:var(--accent);}
.section-label,.meta,.src,.crumb {color:var(--muted);font-size:12px;} .section-label {margin:18px 10px 6px;} .crumb {display:flex;align-items:center;flex-wrap:wrap;gap:8px;}

.s-draft {color:var(--draft);background:var(--draft-bg);} .s-ready {color:var(--ready);background:var(--ready-bg);} .s-running {color:var(--running);background:var(--running-bg);} .s-review {color:var(--review);background:var(--review-bg);} .s-accepted {color:var(--accepted);background:var(--accepted-bg);} .s-integrated {color:var(--integrated);background:var(--integrated-bg);} .s-paused {color:var(--paused);background:var(--paused-bg);} .s-cancelled {color:var(--cancelled);background:var(--cancelled-bg);}

.flow-edge:focus .flow-edge-path,.flow-edge:hover .flow-edge-path,.flow-edge.is-active .flow-edge-path {stroke:var(--accent);stroke-width:3;marker-end:var(--graph-arrow-active);} .flow-edge:focus,.flow-child-toggle:focus,.flow-card-menu:focus {outline:2px solid var(--accent);}

.flow-child-toggle,.flow-card-menu {fill:var(--accent);font-size:12px;cursor:pointer;} .flow-scroll-hint {color:var(--muted);font-size:12px;} .flow-legend {display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;} .visually-hidden {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
.columns {display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:4px 0 16px;max-width:100%;} .state-column {flex:0 0 250px;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;} .state-column[open] {min-width:250px;} .state-column:not([open]) {flex-basis:160px;} .state-column summary {cursor:pointer;font-weight:600;} .board-card {padding:12px;margin:10px 0;} .card-title {background:none;border:0;padding:0;text-align:left;font-weight:600;} .board-card .meta {margin:6px 0;}
.flow-edit-menu {background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:12px;margin:0;position:fixed;z-index:70;width:380px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 8px 28px #0003;} .flow-edit-menu [role=menu] {display:grid;gap:6px;max-height:360px;overflow:auto;} .flow-edit-menu button {text-align:left;} .flow-edit-menu > button {margin-right:8px;margin-top:8px;} .flow-edit-menu h2 {margin-top:0;} .form-row {display:grid;gap:12px;} textarea {width:100%;min-height:70px;} .preview {background:var(--panel-2);color:var(--text);padding:12px;border-radius:8px;margin:12px 0;}
.spec-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;} .row {border-top:1px solid var(--line);padding:10px 0;} .row:first-child {border-top:0;} .tabs {display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;} .tabs [aria-selected=true] {background:var(--accent-bg);color:var(--accent);} pre {white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--panel-2);padding:12px;border-radius:6px;} .attempt {border-left:4px solid var(--line);padding-left:12px;}
.artifact-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: var(--overlay); }

.artifact-header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.artifact-header h2 { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.artifact-header button { flex: none; }
.artifact-content { overflow-y: auto; overflow-x: hidden; min-width: 0; min-height: 0; flex: 1; overflow-wrap: anywhere; padding: 6px 0 20px; }
.preview-meta { color: var(--muted); background: var(--panel); font-size: 12px; overflow-wrap: anywhere; margin: 8px 0; }
.preview-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.preview-trigger { color: var(--accent); background: var(--accent-bg); font-size: 12px; padding: 3px 7px; text-align: left; white-space: normal; max-width: 100%; overflow-wrap: anywhere; }
.preview-code { color: var(--text); background: var(--panel-2); font: 12px/1.7 ui-monospace, SFMono-Regular, monospace; border-radius: 6px; margin: 12px 0; padding: 8px; max-width: 100%; white-space: normal; }
.preview-line { scroll-margin-block: 24px; }
.preview-markdown-marker { display: block; min-height: 8px; }
.preview-code .preview-line { display: grid; grid-template-columns: 4ch minmax(0, 1fr); gap: 8px; padding: 2px 4px; }
.preview-line-text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }

.preview-csv { width: 100%; table-layout: fixed; border-collapse: collapse; margin: 12px 0; }

/* 项目对话常驻右侧；详情覆盖其上，窄屏面板全屏。 */
.board-content.with-conversation {padding-right:380px;}
.project-topbar {display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.project-dialog {position:fixed;right:0;top:0;bottom:0;width:360px;z-index:20;overflow:auto;padding:16px;background:var(--panel);color:var(--text);border-left:1px solid var(--line);overflow-wrap:anywhere;}
.panel-header {display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:-16px;padding:12px 0;background:var(--panel);color:var(--text);z-index:1;border-bottom:1px solid var(--line);}
.conversation-bubble {color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px;margin:12px 0;}
.bubble-user {color:var(--text);background:var(--accent-bg);}
.interview-question {color:var(--text);background:var(--panel);border:1px solid var(--line);padding:10px;margin:10px 0;border-radius:6px;}
.question-type {color:var(--accent);background:var(--accent-bg);font-size:12px;padding:2px 6px;border:1px solid var(--accent);border-radius:4px;}
.proposal-card {color:var(--text);background:var(--panel);border:1px solid var(--line);padding:10px;margin:10px 0;border-radius:6px;}
.organization-reason {color:var(--text);background:var(--panel-2);}
.user-answer {color:var(--text);background:var(--accent-bg);padding:6px;border-radius:4px;white-space:pre-wrap;}
.inbox-group {color:var(--text);background:var(--panel);border:1px solid var(--line);padding:16px;border-radius:10px;margin:16px 0;}
.inbox-item {color:var(--text);background:var(--panel-2);border:1px solid var(--line);padding:12px;border-radius:6px;margin:10px 0;}
.revoked {color:var(--cancelled);background:var(--cancelled-bg);border:1px solid var(--cancelled);border-radius:4px;padding:2px 6px;font-size:12px;}
.detail-backdrop {position:fixed;inset:0;z-index:40;background:var(--overlay);}
.card-detail {position:absolute;right:0;top:0;bottom:0;width:min(720px,calc(100% - 280px));overflow:auto;padding:16px 24px 40px;border-left:1px solid var(--line);color:var(--text);background:var(--panel);animation:detail-slide .15s ease-out;}
.card-detail .spec-grid {grid-template-columns:minmax(0,1fr);}
.project-dialog textarea,.card-detail textarea,.requirement-editor textarea {width:100%;min-height:88px;resize:vertical;}
.project-dialog button {margin-top:5px;}
.project-dialog input {width:100%;}
.requirement-editor textarea {min-height:120px;}
@keyframes detail-slide {from {transform:translateX(25px);}to {transform:translateX(0);}}
@media (prefers-reduced-motion:reduce) {.card-detail {animation:none;}}
@media (max-width:1100px) and (min-width:761px) {.board-content.with-conversation {padding-right:316px;} .project-dialog {width:300px;} .filters {grid-template-columns:repeat(2,minmax(0,1fr));}}
@media (max-width:760px) {
 .board-content.with-conversation {padding-right:0;}
 .project-dialog {inset:0;width:100%;height:100dvh;z-index:30;border:0;padding:16px;}
 .card-detail {inset:0;width:100%;height:100dvh;padding:16px;border:0;}
 .panel-header {top:-16px;}
}
/* 成员、信箱与暂停：颜色沿用已验证的八状态调色板。 */
.member-board {display:grid;grid-template-columns:repeat(4,minmax(210px,1fr));gap:12px;overflow:auto;padding:4px 0 16px;}
.member-column {border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0;}
.member-needs-you {color:var(--review);background:var(--review-bg);}
.member-running {color:var(--running);background:var(--running-bg);}
.member-completed {color:var(--accepted);background:var(--accepted-bg);}
.member-idle {color:var(--draft);background:var(--draft-bg);}
.member-card {color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:10px 0;overflow-wrap:anywhere;}
.status-line {color:var(--text);background:var(--panel-2);border-left:3px solid var(--accent);padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;}
.flow-status-line {fill:var(--text);font-size:12px;}
.unread-marker {color:var(--accent);background:var(--accent-bg);font-size:12px;padding:2px 6px;border-radius:5px;}
.flow-unread {fill:var(--accent);font-size:12px;font-weight:600;}
.dispatch-unknown {color:var(--changed);background:var(--changed-bg);border:1px solid var(--changed);padding:8px;border-radius:6px;}
.has-unknown {border:2px solid var(--changed);}
.pause-marker {color:var(--paused);background:var(--paused-bg);border:1px solid var(--paused);border-radius:5px;padding:3px 6px;}
.runtime-header {display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.demo-round {font-size:12px;}
.session-backdrop {position:fixed;inset:0;z-index:65;background:var(--overlay);display:flex;justify-content:flex-end;}
.session-detail {color:var(--text);background:var(--panel);width:min(720px,100%);height:100%;overflow:auto;border-left:1px solid var(--line);padding:20px;overflow-wrap:anywhere;}
.session-output {color:var(--text);background:var(--panel-2);height:230px;overflow:auto;border:1px solid var(--line);padding:10px;border-radius:6px;}
.output-line {border-bottom:1px solid var(--line);padding:6px 0;}
.output-line time {color:var(--muted);font-size:12px;}
.output-line pre {margin:0;padding:4px 0;}
.dispatch-record {padding:12px;border-bottom:1px solid var(--line);overflow-wrap:anywhere;}
.completion-report {color:var(--text);background:var(--panel-2);padding:10px;border-left:3px solid var(--accepted);}
.mail-message {color:var(--text);background:var(--panel);padding:12px;margin:12px 0;border:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere;}
.message-type,.delivery-status {font-size:12px;display:inline-block;padding:2px 6px;border-radius:5px;}
.mt-status {color:var(--draft);background:var(--draft-bg);}
.mt-dispatch {color:var(--ready);background:var(--ready-bg);}
.mt-completion {color:var(--accepted);background:var(--accepted-bg);}
.mt-escalation {color:var(--changed);background:var(--changed-bg);}
.mt-question {color:var(--review);background:var(--review-bg);}
.mt-heartbeat {color:var(--integrated);background:var(--integrated-bg);}
.ds-pending {color:var(--review);background:var(--review-bg);}
.ds-delivered {color:var(--ready);background:var(--ready-bg);}
.ds-confirmed {color:var(--accepted);background:var(--accepted-bg);}
.ds-undeliverable {color:var(--changed);background:var(--changed-bg);}

.delivery-error {color:var(--changed);background:var(--changed-bg);padding:6px;}
.runtime-notices {color:var(--text);background:var(--panel);position:static;max-width:100%;max-height:240px;overflow:auto;border:2px solid var(--accent);border-radius:8px;padding:8px;box-shadow:0 6px 20px #0003;}
.runtime-notices button {color:var(--accent);background:var(--accent-bg);text-align:left;width:100%;margin:3px 0;}
@media (max-width:760px) {.member-board {grid-template-columns:minmax(0,1fr);overflow:visible;}.session-detail {width:100%;padding:16px;}}

/* 返工：固有宽度不得撑开原生选择框；变动计数不参与按钮行换行。 */
.session-detail label,.session-detail select,.session-detail input,.session-detail textarea,.filters select,.filters input {min-width:0;width:100%;max-width:100%;}
.board-toolbar {display:grid;grid-template-columns:minmax(0,1fr);gap:6px;}
.board-toolbar-primary {display:flex;flex-wrap:wrap;gap:8px;}
.board-toolbar-demo {display:grid;grid-template-columns:120px max-content minmax(0,1fr);gap:8px;align-items:center;}
.board-count {white-space:nowrap;}
.board-round {min-width:0;}
.notification-center,.pause-summary {min-width:0;max-width:100%;}
.notification-center[open],.pause-summary[open] {flex-basis:100%;width:100%;}
.notification-center summary,.pause-summary summary {cursor:pointer;}
.notification-center summary {color:var(--accent);background:var(--accent-bg);padding:3px 6px;border-radius:5px;}
.notification-row {display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:6px;padding:6px 0;}
.notification-row .src {grid-column:1/-1;}
.notification-actions {display:flex;justify-content:flex-end;}
.pause-list {color:var(--text);background:var(--panel);border:1px solid var(--line);padding:10px;}
.sample-marker {color:var(--muted);background:var(--panel-2);font-size:11px;border-radius:4px;padding:1px 4px;}

 .session-detail .card {max-width:100%;}
 .board-toolbar-demo {grid-template-columns:120px minmax(0,1fr);}
 .board-round {grid-column:1/-1;}
}

/* v7 第 4 批：可读的验收报告与原行批注 */
.filters .check {display:flex;gap:6px;align-items:center;white-space:nowrap;font-size:12px;}
.filters .check input[type=checkbox], .check input[type=checkbox] {width:16px;max-width:16px;min-width:16px;flex:0 0 16px;margin:0;}
.card-information {justify-content:flex-start;gap:8px 16px;}
.card-tabs {display:flex;gap:6px;flex-wrap:wrap;}
.card-tabs [role=tab] {color:var(--text);background:var(--panel);}
.card-tabs [aria-selected=true] {color:var(--accent);background:var(--accent-bg);border-color:var(--accent);}
.acceptance-controls,.acceptance-report,.core-report,.leader-report,.modified-tests,.acceptance-actions,.registered-tests {color:var(--text);background:var(--panel);}
.verification-card,.nonpassing-tests,.historical-checks,.workflow-step {color:var(--text);background:var(--panel-2);border:1px solid var(--line);padding:12px;border-radius:8px;margin:10px 0;}

.workflow-step::marker {color:var(--accent);}
.annotation-lines {min-width:0;}
.annotation-row {min-width:0;}
.annotation-line {display:flex;align-items:flex-start;text-align:left;width:100%;gap:8px;border-radius:0;padding:6px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--panel);}
.annotation-line code {white-space:pre-wrap;overflow-wrap:anywhere;min-width:0;flex:1;}
.annotation-number {color:var(--muted);background:var(--panel);flex:0 0 28px;}
.annotation-line.preview-diff-add {color:var(--accepted);background:var(--accepted-bg);}
.annotation-line.preview-diff-delete {color:var(--changed);background:var(--changed-bg);}
.annotation-line.annotation-selected {color:var(--accent);background:var(--accent-bg);border-color:var(--accent);}
.annotation-marker,.annotation-open {color:var(--changed);background:var(--changed-bg);padding:2px 6px;border:1px solid var(--changed);border-radius:4px;}
.annotation-bubble {color:var(--text);background:var(--panel-2);border:1px solid var(--line);border-left:4px solid var(--accent);padding:12px;margin:4px 0 12px 28px;border-radius:6px;}
.annotation-bubble .src {color:var(--muted);}
.annotation-resolved {color:var(--integrated);background:var(--integrated-bg);padding:2px 6px;border:1px solid var(--integrated);border-radius:4px;}
.annotation-editor {color:var(--text);background:var(--panel-2);border:1px solid var(--line);padding:12px;margin:10px 0;}
.annotation-editor textarea {width:100%;min-height:100px;resize:vertical;}
.auto-acceptance {color:var(--text);background:var(--panel);display:grid;gap:10px;}
.auto-acceptance .check {display:flex;align-items:center;gap:6px;}
.card-detail pre {white-space:pre-wrap;overflow-wrap:anywhere;}
.card-detail select,.card-detail textarea {min-width:0;max-width:100%;width:100%;}
.card-detail .form-row {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
@media (max-width:760px) {
 .card-detail .form-row {grid-template-columns:minmax(0,1fr);}
 .annotation-bubble {margin-left:0;}
 .card-tabs [role=tab] {flex:1 1 25%;}
}


.card-detail-overview {max-height:60dvh;overflow:auto;}
@media (max-width:760px) {.card-detail-overview {max-height:none;overflow:visible;}}
/* 027 返工：顶部只读状态行，验收先结论后操作。 */
.card-status-summary {display:flex;align-items:center;gap:8px;margin:8px 0;}
.card-status-summary .status-line {flex:1;min-width:0;margin:0;}
.card-status-summary button {flex:none;}
.status-editor {color:var(--text);background:var(--panel);}
.acceptance-summary {color:var(--text);background:var(--panel);}
.acceptance-state {color:var(--text);background:var(--panel);}
.result-counts {display:flex;gap:8px;flex-wrap:wrap;}

.acceptance-priorities {padding-left:20px;margin:8px 0;}
.acceptance-controls {margin-top:24px;}
#acceptance-outcome:focus,#annotation-outcome:focus {outline:3px solid var(--accent);outline-offset:3px;}
/* 第 5 批：沿用八状态色板；文字、形状与虚线共同标记变化。 */
.replay-controls,.replay-event,.replay-legend {color:var(--text);background:var(--panel);}
.replay-timeline {width:100%;height:32px;accent-color:var(--accent);color:var(--text);background:var(--panel);cursor:ew-resize;}
.replay-timeline::-webkit-slider-runnable-track {height:6px;background:var(--line);border-radius:3px;}
.replay-timeline::-webkit-slider-thumb {margin-top:-5px;}
.replay-new {color:var(--accepted);background:var(--accepted-bg);border:1px solid var(--accepted);padding:3px 8px;}
.replay-changed {color:var(--changed);background:var(--changed-bg);border:2px dashed var(--changed);padding:3px 8px;}
.replay-split {color:var(--running);background:var(--running-bg);border:1px dashed var(--running);padding:3px 8px;}
.replay-inferred {color:var(--muted);background:var(--panel);}
.replay-legend {display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.replay-directory {display:block;text-align:left;margin:8px 0;}
.flow-replay-mark {fill:var(--changed);font-size:12px;font-weight:700;}
.replay-parent-edge .flow-edge-path {stroke-dasharray:6 4;}
.flow-node[data-replay-mark="△ 刚变化"] .flow-node-box {stroke-dasharray:6 3;stroke-width:3;}
.flow-node[data-replay-mark="＋ 新增"] .flow-node-box {stroke-width:3;}
.ask-backdrop {position:fixed;inset:0;z-index:45;display:flex;justify-content:flex-end;background:var(--overlay);}
.ask-panel {width:min(640px,calc(100% - 280px));height:100dvh;overflow:auto;padding:18px 24px 40px;border-left:1px solid var(--line);color:var(--text);background:var(--panel);overscroll-behavior:contain;overflow-wrap:anywhere;}
.ask-panel textarea {width:100%;min-height:90px;resize:vertical;}
.ask-confirmed {color:var(--accepted);background:var(--accepted-bg);border:1px solid var(--accepted);}
.ask-inferred {color:var(--review);background:var(--review-bg);border:2px dashed var(--review);}
.ask-unknown {color:var(--paused);background:var(--paused-bg);border:1px solid var(--paused);}
.ask-conclusion {padding:12px;margin:12px 0;border-radius:8px;}
.ask-conclusion button {margin:4px 0;}
.ask-history,.ask-suggestion,.playbook-item,.tool-item,.executor-item,.handbook-roles {color:var(--text);background:var(--panel);}
.playbook-item {border-top:1px solid var(--line);padding:12px 0;}
.playbook-item textarea {width:100%;min-height:100px;}
.play-status {color:var(--accent);background:var(--accent-bg);font-size:12px;padding:3px 7px;}
.cap-confirmed {color:var(--accepted);background:var(--accepted-bg);border:1px solid var(--accepted);}
.cap-partial {color:var(--review);background:var(--review-bg);border:1px dashed var(--review);}
.cap-untested {color:var(--paused);background:var(--paused-bg);border:1px solid var(--paused);}
.cap-blocked {color:var(--changed);background:var(--changed-bg);border:1px solid var(--changed);}
.cap-reminder {color:var(--review);background:var(--review-bg);border:1px dashed var(--review);}
.cap-upcoming {color:var(--muted);background:var(--panel-2);border:1px solid var(--line);}
.cap-confirmed,.cap-partial,.cap-untested,.cap-blocked,.cap-reminder,.cap-upcoming {display:inline-block;padding:4px 8px;margin:4px 0;border-radius:4px;}
.table-scroll {overflow:auto;max-width:100%;}
.handbook-roles th,.handbook-roles td {text-align:left;vertical-align:top;white-space:normal;}
.settings-editor textarea {width:100%;min-height:100px;resize:vertical;}
.artifact-backdrop {z-index:60;}
@media(max-width:760px){.ask-panel{width:100%;padding:16px;border:0;}.replay-legend{flex-direction:column;align-items:flex-start;}}

.workflow-topology,.workflow-branch {color:var(--text);background:var(--panel);}
.workflow-branches {display:flex;flex-wrap:wrap;gap:8px;}
.workflow-branch {border:1px solid var(--line);padding:8px;flex:1;min-width:120px;}
.workflow-unverifiable {color:var(--paused);background:var(--paused-bg);border:1px solid var(--paused);padding:10px;margin:12px 0;}
/* 029 返工：连续拖动保留原生 range；图和说明分别在固定高度内滚动。 */
button.ok {color:var(--on-ok);background:var(--accepted);border-color:var(--accepted);}
button.ok:hover {color:var(--on-ok);background:var(--accepted);}
button.ok:disabled,button.primary:disabled {color:var(--muted);background:var(--panel-2);border-color:var(--line);}

.replay-workspace {display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);gap:12px;height:min(72dvh,760px);min-height:440px;}
.replay-controls {margin:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;}
.replay-header {flex:none;color:var(--text);background:var(--panel);border-bottom:1px solid var(--line);padding-bottom:8px;}
.replay-directory-panel {flex:none;max-height:30%;overflow:hidden;color:var(--text);background:var(--panel);border-top:1px solid var(--line);}
.replay-directory-panel[open] {display:flex;flex-direction:column;}

.replay-directory-scroll {min-height:0;max-height:min(8dvh,64px);overflow:auto;overscroll-behavior:contain;color:var(--text);background:var(--panel);}
.replay-explanation {flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;color:var(--text);background:var(--panel);}
.replay-graph {display:flex;flex-direction:column;min-height:0;}

.test-evidence {margin:8px 0;padding:8px;border:1px solid var(--line);color:var(--text);background:var(--panel);}
.test-correction {color:var(--accent);background:var(--accent-bg);padding:8px;}
.inbox-item {display:flex;flex-direction:column;align-items:stretch;min-width:0;}
.inbox-item > button {align-self:stretch;white-space:normal;overflow-wrap:anywhere;text-align:left;}
@media(max-width:760px) {
 .replay-workspace {grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);height:min(90dvh,800px);min-height:520px;}
 .replay-header h2 {font-size:18px;margin:0 0 6px;}

 .inbox-item {display:flex;flex-direction:column;align-items:stretch;}
 .inbox-item > button,.inbox-item > .grow,.inbox-item > .impact,.inbox-item > .src {width:100%;min-width:0;max-width:100%;flex:none;white-space:normal;overflow-wrap:anywhere;}
}
.playbook-group,.playbook-group > summary {color:var(--text);background:var(--panel);}

 .replay-workspace {grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.5fr) minmax(0,1fr);height:min(90dvh,800px);min-height:520px;}
}
