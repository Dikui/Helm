<style>

  --paused:#c1b1ff; --paused-bg:#302842; --cancelled:#ffa0ca; --cancelled-bg:#412337;
  --changed:#ff9b90; --changed-bg:#3d2220;
  --group-0:#a6bcff; --group-0-bg:#232c45; --group-1:#7edba6; --group-1-bg:#1d3326;
  --group-2:#c1b1ff; --group-2-bg:#302842; --group-3:#73d5e7; --group-3-bg:#18343b;
  --group-4:#ffa0ca; --group-4-bg:#412337; --group-5:#f0bb6a; --group-5-bg:#3a2d17;

}
 :root[data-theme="dark"] {
  --bg:#161615; --panel:#1f1f1d; --panel-2:#282825; --text:#ecebe6; --muted:#c0beb5; --line:#a3a197;
  --accent:#a6bcff; --accent-bg:#232c45; --on-accent:#161615; --edge:#cccac2;
  --draft:#c1c2ce; --draft-bg:#2b2c33; --ready:#a6bcff; --ready-bg:#232c45;
  --running:#c1b1ff; --running-bg:#302842; --review:#f0bb6a; --review-bg:#3a2d17;
  --accepted:#7edba6; --accepted-bg:#1d3326; --integrated:#73d5e7; --integrated-bg:#18343b;
  --paused:#c1b1ff; --paused-bg:#302842; --cancelled:#ffa0ca; --cancelled-bg:#412337;
  --changed:#ff9b90; --changed-bg:#3d2220;
  --group-0:#a6bcff; --group-0-bg:#232c45; --group-1:#7edba6; --group-1-bg:#1d3326;

* {box-sizing:border-box;} html,body {margin:0;height:100%;} html {overflow-anchor:none;scroll-behavior:auto;} body {font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);}
.app {display:grid;grid-template-columns:248px minmax(0,1fr);height:100dvh;max-width:100%;}
aside {background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow:auto;}
main {min-width:0;max-width:100%;overflow:auto;overflow-anchor:none;overflow-x:hidden;padding:24px 28px 60px;}
h1 {font-size:24px;margin:12px 0;} h2 {font-size:17px;margin:0 0 12px;} h3 {font-size:15px;} p {margin:8px 0;}
button,input,textarea,select {font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:6px 10px;max-width:100%;}
button {cursor:pointer;} button:hover {background:var(--panel-2);} button.primary {color:var(--on-accent);background:var(--accent);border-color:var(--accent);} button:disabled {cursor:not-allowed;color:var(--muted);}
a,a:visited {color:var(--accent);} a:hover {text-decoration-thickness:2px;} :focus-visible {outline:3px solid var(--accent);outline-offset:3px;} input[type=text] {width:100%;} label {display:grid;gap:4px;min-width:0;}
.brand {font-size:20px;font-weight:700;padding:0 10px 16px;} .brand small {display:block;font-size:12px;color:var(--muted);font-weight:400;}
.nav-item {width:100%;text-align:left;display:flex;gap:8px;justify-content:space-between;border:0;margin:4px 0;padding:9px 10px;} .nav-item.active {background:var(--accent-bg);color:var(--accent);}
.section-label,.meta,.src,.crumb {color:var(--muted);font-size:12px;} .section-label {margin:18px 10px 6px;} .crumb {display:flex;align-items:center;flex-wrap:wrap;gap:8px;}
.head {display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;} .actions,.view-switch,.toolbar {display:flex;gap:8px;flex-wrap:wrap;align-items:center;} .view-switch {margin:18px 0 12px;} .view-switch [aria-pressed=true] {background:var(--accent-bg);color:var(--accent);border-color:var(--accent);}
.card {background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0;overflow-wrap:anywhere;min-width:0;} .budget {display:flex;flex-wrap:wrap;gap:12px;padding:10px 0;color:var(--muted);} .filters {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;} .check {display:flex;align-items:center;gap:6px;} .chip,.tag {display:inline-block;font-size:12px;padding:2px 7px;border-radius:5px;} .tag {background:var(--panel-2);color:var(--muted);margin:2px 3px 2px 0;} .empty {padding:24px;color:var(--muted);} .notice,.changed {color:var(--changed);background:var(--changed-bg);border:1px solid var(--changed);border-radius:6px;padding:6px 10px;}
.notice {position:fixed;right:16px;bottom:16px;z-index:29;margin:0;max-width:min(520px,calc(100vw - 32px));}
.notice-neutral {color:var(--muted);background:var(--panel-2);border-color:var(--line);} .notice-success {color:var(--accepted);background:var(--accepted-bg);border-color:var(--accepted);} .notice-error {color:var(--changed);background:var(--changed-bg);border-color:var(--changed);}
#board-drag-feedback {position:fixed;right:16px;bottom:16px;z-index:30;max-width:calc(100vw - 32px);margin:0;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;pointer-events:none;}
.s-draft {color:var(--draft);background:var(--draft-bg);} .s-ready {color:var(--ready);background:var(--ready-bg);} .s-running {color:var(--running);background:var(--running-bg);} .s-review {color:var(--review);background:var(--review-bg);} .s-accepted {color:var(--accepted);background:var(--accepted-bg);} .s-integrated {color:var(--integrated);background:var(--integrated-bg);} .s-paused {color:var(--paused);background:var(--paused-bg);} .s-cancelled {color:var(--cancelled);background:var(--cancelled-bg);}
.flow-diagram {min-width:0;position:relative;} .flow-canvas {overflow:auto;max-width:100%;overflow-anchor:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;overscroll-behavior:contain;}
.flow-svg {display:block;max-width:none;} .flow-svg [hidden], .flow-svg [hidden] * {display:none !important;} .scroll-range-tail {display:block;flex:none;pointer-events:none;} .flow-node {cursor:pointer;outline:none;fill:var(--text);} .flow-node-box {fill:var(--panel);stroke:var(--line);stroke-width:1.5;}
.flow-node[data-state=draft] {--state:var(--draft);--state-bg:var(--draft-bg);} .flow-node[data-state=ready] {--state:var(--ready);--state-bg:var(--ready-bg);} .flow-node[data-state=running] {--state:var(--running);--state-bg:var(--running-bg);} .flow-node[data-state=review] {--state:var(--review);--state-bg:var(--review-bg);} .flow-node[data-state=accepted] {--state:var(--accepted);--state-bg:var(--accepted-bg);} .flow-node[data-state=integrated] {--state:var(--integrated);--state-bg:var(--integrated-bg);} .flow-node[data-state=paused] {--state:var(--paused);--state-bg:var(--paused-bg);} .flow-node[data-state=cancelled] {--state:var(--cancelled);--state-bg:var(--cancelled-bg);}
.flow-node .flow-node-box {stroke:var(--state);} .flow-state-bg {fill:var(--state-bg);} .flow-state-text {fill:var(--state);font-size:12px;}
.flow-title {fill:var(--text);font-size:14px;font-weight:600;} .flow-agent,.flow-meta {fill:var(--muted);font-size:12px;} .flow-warning {fill:var(--changed);font-size:12px;font-weight:600;}
.flow-node:focus .flow-node-box,.flow-node:hover .flow-node-box {stroke:var(--accent);stroke-width:3;} .flow-edge-path {fill:none;stroke:var(--edge);stroke-width:2;} .flow-arrow {fill:var(--edge);} .flow-arrow-active {fill:var(--accent);} .flow-edge {cursor:pointer;} .flow-edge-hit {fill:none;stroke:transparent;stroke-width:16;}
.flow-edge:focus .flow-edge-path,.flow-edge:hover .flow-edge-path,.flow-edge.is-active .flow-edge-path {stroke:var(--accent);stroke-width:3;marker-end:var(--graph-arrow-active);} .flow-edge:focus,.flow-child-toggle:focus,.flow-card-menu:focus {outline:2px solid var(--accent);}
.flow-connect-port {fill:var(--accent-bg);stroke:var(--accent);stroke-width:2;cursor:crosshair;} .flow-temporary-line {fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 3;pointer-events:none;}
.flow-drop-allowed .flow-node-box {stroke:var(--accepted);stroke-width:3;} .flow-drop-forbidden .flow-node-box {stroke:var(--changed);stroke-dasharray:4 3;} .flow-drop-label {font-size:12px;fill:var(--text);} .flow-drop-feedback {pointer-events:none;} .flow-drop-feedback-bg {fill:var(--panel);stroke:var(--line);}
.flow-group {fill:var(--group-bg);stroke:var(--group);stroke-width:1.5;} .flow-group-label {fill:var(--group);font-size:12px;font-weight:600;} .group-0 {--group:var(--group-0);--group-bg:var(--group-0-bg);} .group-1 {--group:var(--group-1);--group-bg:var(--group-1-bg);} .group-2 {--group:var(--group-2);--group-bg:var(--group-2-bg);} .group-3 {--group:var(--group-3);--group-bg:var(--group-3-bg);} .group-4 {--group:var(--group-4);--group-bg:var(--group-4-bg);} .group-5 {--group:var(--group-5);--group-bg:var(--group-5-bg);}
.flow-card-menu {visibility:hidden;} .flow-node:hover .flow-card-menu,.flow-node:focus-within .flow-card-menu,.flow-svg[data-editing="true"] .flow-card-menu {visibility:visible;}
.flow-child-toggle,.flow-card-menu {fill:var(--accent);font-size:12px;cursor:pointer;} .flow-scroll-hint {color:var(--muted);font-size:12px;} .flow-legend {display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;} .visually-hidden {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);}
.columns {display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding:4px 0 16px;max-width:100%;} .state-column {flex:0 0 250px;min-width:0;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px;} .state-column[open] {min-width:250px;} .state-column:not([open]) {flex-basis:160px;} .state-column summary {cursor:pointer;font-weight:600;} .board-card {padding:12px;margin:10px 0;} .card-title {background:none;border:0;padding:0;text-align:left;font-weight:600;} .board-card .meta {margin:6px 0;}
.flow-edit-menu {background:var(--panel);border:2px solid var(--accent);border-radius:8px;padding:12px;margin:0;position:fixed;z-index:70;width:380px;max-width:calc(100vw - 24px);max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 8px 28px #0003;} .flow-edit-menu [role=menu] {display:grid;gap:6px;max-height:360px;overflow:auto;} .flow-edit-menu button {text-align:left;} .flow-edit-menu > button {margin-right:8px;margin-top:8px;} .flow-edit-menu h2 {margin-top:0;} .form-row {display:grid;gap:12px;} textarea {width:100%;min-height:70px;} .preview {background:var(--panel-2);color:var(--text);padding:12px;border-radius:8px;margin:12px 0;}
.spec-grid {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;} .row {border-top:1px solid var(--line);padding:10px 0;} .row:first-child {border-top:0;} .tabs {display:flex;gap:8px;flex-wrap:wrap;margin:16px 0;} .tabs [aria-selected=true] {background:var(--accent-bg);color:var(--accent);} pre {white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--panel-2);padding:12px;border-radius:6px;} .attempt {border-left:4px solid var(--line);padding-left:12px;}
.artifact-backdrop { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: var(--overlay); }
.artifact-drawer { width: min(720px, 100%); max-width: 100%; height: 100%; display: flex; flex-direction: column; padding: 20px; border-left: 1px solid var(--line); color: var(--text); background: var(--panel); overflow: hidden; }
.artifact-header { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
.artifact-header h2 { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.artifact-header button { flex: none; }
.artifact-content { overflow-y: auto; overflow-x: hidden; min-width: 0; min-height: 0; flex: 1; overflow-wrap: anywhere; padding: 6px 0 20px; }
.preview-meta { color: var(--muted); background: var(--panel); font-size: 12px; overflow-wrap: anywhere; margin: 8px 0; }
.preview-links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.preview-trigger { color: var(--accent); background: var(--accent-bg); font-size: 12px; padding: 3px 7px; text-align: left; white-space: normal; max-width: 100%; overflow-wrap: anywhere; }
.preview-code { color: var(--text); background: var(--panel-2); font: 12px/1.7 ui-monospace, SFMono-Regular, monospace; border-radius: 6px; margin: 12px 0; padding: 8px; max-width: 100%; white-space: normal; }
.preview-line { scroll-margin-block: 24px; }
.preview-markdown-marker { display: block; min-height: 8px; }
.preview-code .preview-line { display: grid; grid-template-columns: 4ch minmax(0, 1fr); gap: 8px; padding: 2px 4px; }
.preview-line-text { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.preview-line-number { color: var(--muted); background: var(--panel-2); font-variant-numeric: tabular-nums; user-select: none; white-space: nowrap; font-size: 11px; }
.preview-diff .preview-line { grid-template-columns: 10ch 2ch minmax(0, 1fr); }
.preview-diff-add { color: var(--accepted); background: var(--accepted-bg); }
.preview-diff-add .preview-line-number { color: var(--accepted); background: var(--accepted-bg); }
.preview-diff-delete { color: var(--changed); background: var(--changed-bg); }
.preview-diff-delete .preview-line-number { color: var(--changed); background: var(--changed-bg); }
.preview-highlight { color: var(--accent); background: var(--accent-bg); outline: 2px solid var(--accent); outline-offset: -2px; }
.preview-highlight .preview-line-number { color: var(--accent); background: var(--accent-bg); }
.preview-csv { width: 100%; table-layout: fixed; border-collapse: collapse; margin: 12px 0; }
.preview-csv th { color: var(--text); background: var(--panel-2); text-align: left; padding: 8px; border: 1px solid var(--line); overflow-wrap: anywhere; }
.preview-csv td { color: var(--text); background: var(--panel); padding: 8px; border: 1px solid var(--line); overflow-wrap: anywhere; white-space: pre-wrap; }
.preview-csv .preview-highlight th, .preview-csv .preview-highlight td { color: var(--accent); background: var(--accent-bg); }

@media (max-width:760px) {
 .flow-edit-menu {left:0;right:0;bottom:0;top:auto;width:100%;max-width:100%;max-height:85dvh;border-radius:12px 12px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));}
 .artifact-drawer {width:100%;padding:14px;border-left:0;}
 .flow-canvas {max-height:min(65dvh,560px);overflow:auto;}
 .app {grid-template-columns:minmax(0,1fr);height:auto;} aside {border-right:0;border-bottom:1px solid var(--line);max-height:220px;} main {padding:16px;overflow-x:hidden;} .filters {grid-template-columns:repeat(2,minmax(0,1fr));} .spec-grid {grid-template-columns:minmax(0,1fr);} .columns {display:grid;grid-template-columns:minmax(0,1fr);overflow-x:clip;} .state-column,.state-column[open] {width:100%;min-width:0;} .flow-connect-port {display:none;} .head {align-items:flex-start;} .card {padding:12px;} .crumb select {width:100%;} .toolbar {align-items:stretch;} button {overflow-wrap:anywhere;}
}
</style>

<div class="app"><aside id="side" aria-label="主导航"></aside><main id="main" aria-live="polite"></main></div>
<div id="modal-root"></div><div id="artifact-root"></div>
