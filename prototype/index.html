<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helm 原型</title>
<style>
:root {
  --bg: #f6f6f3; --panel: #ffffff; --panel-2: #f0efea; --line: #e2e0d8;
  --text: #1d1d1b; --muted: #6b6a64; --faint: #9a988f;
  --accent: #2f5bd3; --accent-soft: #e6ecfb;
  --ok: #1f874c; --ok-soft: #e3f3ea; --warn: #b26a00; --warn-soft: #fbf0dc;
  --bad: #c0392b; --bad-soft: #fbe6e3; --agent: #7a4fc4; --agent-soft: #efe8fa;
  --on-accent: #ffffff; --on-ok: #ffffff; --on-bad: #ffffff;
  --overlay: #00000066;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161615; --panel: #1f1f1d; --panel-2: #282825; --line: #34332f;
    --text: #ecebe6; --muted: #a3a197; --faint: #75736b;
    --accent: #7c9cf0; --accent-soft: #232c45;
    --ok: #5cc48a; --ok-soft: #1d3326; --warn: #e3a64a; --warn-soft: #3a2d17;
    --bad: #ef7d70; --bad-soft: #3d2220; --agent: #b598ea; --agent-soft: #2e2540;
    --on-accent: #161615; --on-ok: #161615; --on-bad: #161615;
    --overlay: #00000099;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.55 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
button { font: inherit; cursor: pointer; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 6px 12px; }
button:hover { border-color: var(--faint); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
button.ok { background: var(--ok); border-color: var(--ok); color: var(--on-ok); }
button.bad { color: var(--bad); }
button.small { padding: 3px 9px; font-size: 12px; }
button:disabled { cursor: not-allowed; opacity: .5; }
select { font: inherit; border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; background: var(--panel); color: var(--text); }
textarea, input[type=text] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--panel); color: var(--text); }
textarea { resize: vertical; min-height: 60px; }

.app { display: grid; grid-template-columns: 290px 1fr; height: 100vh; }
aside { border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 14px 10px; }
main { overflow-y: auto; padding: 22px 28px 60px; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; padding: 2px 8px 14px; }
.brand small { font-weight: 400; color: var(--faint); font-size: 12px; }
.nav-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 10px; border-radius: 7px; cursor: pointer; }
.nav-item:hover { background: var(--panel-2); }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.count { background: var(--bad); color: var(--on-bad); border-radius: 10px; font-size: 11px; padding: 0 7px; font-weight: 600; }
.section-label { font-size: 11px; color: var(--faint); letter-spacing: .06em; padding: 16px 10px 6px; }
.tree-node { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; }
.tree-node:hover { background: var(--panel-2); }
.tree-node.active { background: var(--accent-soft); }
.tree-node .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.s-draft { background: var(--panel-2); color: var(--muted); } .d-draft { background: var(--faint); }
.s-ready { background: var(--accent-soft); color: var(--accent); } .d-ready { background: var(--accent); }
.s-running { background: var(--agent-soft); color: var(--agent); } .d-running { background: var(--agent); }
.s-blocked { background: var(--warn-soft); color: var(--warn); } .d-blocked { background: var(--warn); }
.s-verifying { background: var(--agent-soft); color: var(--agent); } .d-verifying { background: var(--agent); }
.s-in_review { background: var(--warn-soft); color: var(--warn); } .d-in_review { background: var(--warn); }
.s-changes_requested { background: var(--bad-soft); color: var(--bad); } .d-changes_requested { background: var(--bad); }
.s-accepted { background: var(--ok-soft); color: var(--ok); } .d-accepted { background: var(--ok); }
.s-abandoned { background: var(--panel-2); color: var(--muted); } .d-abandoned { background: var(--faint); }
.k { font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.who-agent { color: var(--agent); } .who-human { color: var(--accent); }

h1 { font-size: 21px; margin: 4px 0 6px; }
h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
h2 .hint { font-weight: 400; font-size: 12px; color: var(--faint); }
.crumb { color: var(--faint); font-size: 12px; }
.crumb a { color: var(--muted); cursor: pointer; text-decoration: none; }
.crumb a:hover { text-decoration: underline; }
.meta { color: var(--muted); font-size: 12px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.head { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; margin-bottom: 18px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

.banner { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; display: flex; gap: 12px; align-items: flex-start; }
.banner.warn { background: var(--warn-soft); }
.banner.agent { background: var(--agent-soft); }
.banner.ok { background: var(--ok-soft); }
.banner.neutral { background: var(--panel-2); color: var(--muted); }
.banner .grow { flex: 1; }
.banner b { display: block; margin-bottom: 2px; }

.cols { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.col-label { font-size: 11px; letter-spacing: .08em; color: var(--faint); margin-bottom: 4px; }
.need { white-space: pre-wrap; }
.row { padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: none; }
.row-top { display: flex; gap: 8px; align-items: flex-start; }
.row-top .grow { flex: 1; }
.src { font-size: 11px; color: var(--faint); margin-top: 2px; }
.unconfirmed { background: var(--warn-soft); margin: 0 -8px; padding: 9px 8px; border-radius: 6px; }

.verdict { font-size: 12px; font-weight: 600; white-space: nowrap; }
.v-pass { color: var(--ok); } .v-fail { color: var(--bad); } .v-unchecked { color: var(--faint); }
.v-unresolved { color: var(--warn); }
details.ev { margin-top: 6px; }
details.ev summary { font-size: 12px; color: var(--muted); cursor: pointer; }
.ev-item { margin: 6px 0 0 4px; padding: 7px 10px; background: var(--panel-2); border-radius: 6px; font-size: 12.5px; }
.ev-item code { font-family: var(--mono); font-size: 11.5px; color: var(--accent); }
.ev-item .by { font-size: 11px; color: var(--faint); }

.change { border: 1px dashed var(--warn); border-radius: var(--radius); padding: 12px 14px; background: var(--panel); margin-bottom: 14px; }
.diff { font-family: var(--mono); font-size: 12.5px; background: var(--panel-2); border-radius: 6px; padding: 8px 10px; margin: 8px 0; }
.diff .add { color: var(--ok); } .diff .del { color: var(--bad); }

.below { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
details.process > summary { cursor: pointer; list-style: none; }
details.process > summary::-webkit-details-marker { display: none; }
.tl { margin-top: 10px; }
.tl-item { display: grid; grid-template-columns: 52px 92px 1fr; gap: 8px; font-size: 12.5px; padding: 5px 0; border-top: 1px solid var(--line); }
.tl-item .time { color: var(--faint); font-family: var(--mono); font-size: 11.5px; }
.kid { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; }
.kid:first-child { border-top: none; }
.kid:hover .t { color: var(--accent); }
.kid .t { flex: 1; }

.inbox-group { margin-bottom: 22px; }
.inbox-item { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; cursor: pointer; }
.inbox-item:hover { border-color: var(--faint); }
.inbox-item .grow { flex: 1; min-width: 0; }
.inbox-item .sub { font-size: 12px; color: var(--muted); }
.impact { font-size: 11px; color: var(--bad); white-space: nowrap; }
.empty { color: var(--faint); font-size: 13px; padding: 4px 2px 10px; }
.intro { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 22px; font-size: 13px; color: var(--muted); }
.intro b { color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.toast { position: fixed; z-index: 20; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.add-row { display: flex; gap: 6px; margin-top: 10px; }
.add-row input { flex: 1; min-width: 0; }
.add-row select, .add-row button { flex: none; }
.info-band { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 18px; margin-bottom: 16px; }
.info-band > div, .cols > div, .below > div { min-width: 0; overflow-wrap: anywhere; }
.info-band ul, .handoff ul { padding-left: 18px; margin: 4px 0 10px; }
.limit-row { margin-top: 6px; font-size: 12px; }
.limit-row .meta { justify-content: space-between; }
.progress { height: 6px; border-radius: 6px; background: var(--panel-2); overflow: hidden; margin-top: 4px; }
.progress span { display: block; height: 100%; background: var(--accent); }
.limit-row.warning { color: var(--warn); } .limit-row.warning .progress span { background: var(--warn); }
.limit-row.exhausted { color: var(--bad); } .limit-row.exhausted .progress span { background: var(--bad); }
.handoff { grid-column: 1 / -1; }
.handoff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin-top: 10px; }
.tabs { display: flex; gap: 6px; margin: 12px 0 8px; }
.tabs .active { color: var(--accent); background: var(--accent-soft); border-color: var(--accent); }
.attempt { margin-top: 8px; padding: 10px; background: var(--panel-2); border-radius: 7px; }
.attempt.failed { border-left: 3px solid var(--bad); background: var(--bad-soft); }
.attempt.limited { border-left: 3px solid var(--warn); }
.attempt .reason { margin-top: 6px; color: var(--bad); font-size: 12px; }
.check { margin-top: 5px; }
.resolution { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.action-hint { width: 100%; text-align: right; color: var(--warn); font-size: 12px; }
.modal-backdrop { position: fixed; inset: 0; z-index: 10; background: var(--overlay); display: grid; place-items: center; padding: 20px; }
.modal { width: min(820px, 100%); max-height: 90vh; display: flex; flex-direction: column; }
.modal h2 { justify-content: space-between; flex-wrap: wrap; }
.prompt-preview { margin: 6px 0 12px; padding: 12px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel-2); white-space: pre-wrap; overflow-wrap: anywhere; overflow-y: auto; font: 12px/1.65 var(--mono); }
[hidden] { display: none !important; }

@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .below { grid-template-columns: 1fr; } .info-band { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: none; border-bottom: 1px solid var(--line); max-height: 45vh; }
  main { padding: 16px; }
  .head { flex-direction: column; }
  .actions { justify-content: flex-start; }
  .action-hint { text-align: left; }
  .handoff-grid { grid-template-columns: 1fr; }
  .add-row { flex-wrap: wrap; }
  .add-row input { flex-basis: 100%; }
  .inbox-item { position: relative; flex-wrap: wrap; justify-content: flex-start; align-items: flex-start; row-gap: 8px; }
  .inbox-item > .dot { position: absolute; top: 19px; left: 14px; }
  .inbox-item > .grow { flex: 0 0 100%; padding-left: 20px; overflow-wrap: anywhere; }
  .inbox-item > .impact { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
  .inbox-item > .chip { flex: none; }
  .modal-backdrop { padding: 12px; }
  .tl-item { grid-template-columns: 46px 1fr; } .tl-item .who { grid-column: 2; }
}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
// ---------- mock data: two chained cases ----------
const STATUS = {
  draft: '草稿·待批准', ready: '就绪', running: '代理执行中', blocked: '阻塞·等你回答',
  verifying: '验证中', in_review: '待签收', changes_requested: '已打回', accepted: '已签收', abandoned: '已终止',
};
const KIND = { deterministic: '确定性', evidence: '证据型', adversarial: '对抗型', judgment: '判断型' };
const KIND_HINT = {
  deterministic: '自动执行', evidence: 'verifier 逐条核对来源', adversarial: 'redteam 挑错，须全部回应', judgment: '由你签字',
};

const db = {
  c1: {
    id: 'c1', parent: null, title: '客户 A · 智能排产需求能否承接', status: 'running', version: 2, owner: 'chief',
    need: '客户 A（离散制造，年产值约 8 亿）提出智能排产需求：根据订单、设备、人员自动生成周排产计划，并与其现有 ERP 同步。\n\n判断我们能否承接，给出结论：可行 / 有条件可行 / 不可行。',
    deliverable: 'Markdown 承接评估报告：evidence/c1/承接评估.md（含结论、依据、风险、条件及子契约证据索引）',
    sources: ['公开行业数据与企业官网', 'experience/ 内部项目、基准与资源资料', '已批准的子契约结论与证据'],
    limit: { deadline: '2026-10-10 18:00', maxAttempts: 3, tokenBudget: 30000, usedAttempts: 1, usedTokens: 6800 },
    boundaries: [
      { text: '只使用公开数据与内部资料', src: 'human', ok: true, enf: 'enforced', mech: 'worker 的资料工具仅开放公开网页检索与 experience/ 内部资料读取' },
      { text: '不直接联系客户', src: 'human', ok: true, enf: 'enforced', mech: 'worker 未被授予邮件 / IM 类工具' },
      { text: '3 个工作日内给出结论（截止 10/10）', src: 'human', ok: true, enf: 'advisory' },
      { text: '不承诺超出当前交付产能的上线时间', src: 'agent_draft', ok: true, enf: 'advisory', why: '起草自经验库：P-2024-11 因过度承诺工期导致违约' },
    ],
    tests: [
      { id: 't1', kind: 'deterministic', text: '结论包含：结论、依据、风险、条件 四部分', v: 'unchecked' },
      { id: 't2', kind: 'evidence', text: '每条依据可追溯至市场数据或过往项目编号', v: 'unchecked' },
      { id: 't3', kind: 'adversarial', text: '红队质疑全部得到回应', v: 'unchecked' },
      { id: 't4', kind: 'judgment', text: '技术 / 产能 / 成本 三个子契约均已签收，结论可对外沟通', v: 'unchecked' },
    ],
    evidence: {},
    handoff: {
      updated: '10/07 09:18 · agent:chief',
      baseline: '已有技术、交付产能、成本与报价三份子契约；承接结论尚未形成',
      done: ['已批准需求与边界', '已派发技术、产能、成本子契约', '已补充竞品与市场规模调研子契约'],
      decisions: ['先核对当前能力与产能，再汇总结论：避免在子契约未确认前承诺交付'],
      open: ['交付产能缺少 Q4 排期', '成本子契约的毛利下限变更待批准', '技术对接先例仍需人工确认', '市场调研达到 token 上限'],
      next: '处理子契约阻塞与待判定检查，待证据齐备后汇总承接结论',
      outputs: ['evidence/c1/承接评估-提纲.md'],
    },
    attempts: [
      { number: 1, actor: 'agent:chief', model: 'opus-5.5 · high', method: '拆解技术、产能、成本与市场调研，逐项汇总证据', result: 'running', failure: '', tokens: 6800, duration: '持续 2 小时' },
    ],
    log: [
      ['10/07 09:12', 'human', '创建契约并批准'],
      ['10/07 09:14', 'agent:chief', '拆解为 3 个子契约：技术可行性、交付产能、成本与报价'],
      ['10/07 09:15', 'agent:chief', '等待子契约完成后汇总结论'],
      ['10/07 09:18', 'agent:chief', '补充第 4 个子契约：竞品与市场规模调研'],
    ],
  },
  c1a: {
    id: 'c1a', parent: 'c1', title: '技术可行性', status: 'in_review', version: 1, owner: 'worker',
    need: '评估现有平台能否支撑客户 A 的排产需求：约束求解规模、ERP 对接方式、数据前置条件。',
    deliverable: 'Markdown 技术可行性报告：evidence/c1a/技术可行性.md（附基准、ERP 文档引用与风险回应）',
    sources: ['experience/specs/engine-v3.md 调度引擎 v3 官方规格', 'experience/benchmarks/engine-v3-2025Q2.md', 'experience/projects/ 既有实施与复盘记录', 'SAP / 用友公开接口文档'],

    tests: [

      { id: 't2', kind: 'evidence', text: 'ERP 对接方式有接口文档或过往实施记录支撑', v: 'unresolved' },
      { id: 't3', kind: 'adversarial', text: '红队质疑全部得到回应', v: 'pass' },
      { id: 't4', kind: 'judgment', text: '技术负责人认可结论', v: 'unchecked' },
    ],
    result: '有条件可行：200 台设备 × 3000 工单/周 在引擎 v3 基准内（求解 < 4 分钟）。ERP 单向导入可行；双向实时同步无先例，建议首期不含。前提：客户提供 ≥ 6 个月历史工单数据。',
    evidence: {
      t1: [{ claim: '引擎 v3 在 250 台 × 4000 工单规模下求解 3.2 分钟', ref: 'experience/benchmarks/engine-v3-2025Q2.md#L40', by: 'agent:worker', checks: [{ checker: 'agent:verifier', result: 'pass', note: '数字与原文一致', method: '独立代理复核', correction: '' }] }],
      t2: [
        { claim: 'SAP 单向导入已在 P-2025-03 实施', ref: 'experience/projects/P-2025-03/交付报告.md', by: 'agent:worker', checks: [{ checker: 'agent:verifier', result: 'pass', note: '原文确认', method: '独立代理复核', correction: '' }] },
        { claim: '无双向实时同步的交付记录', ref: 'experience/projects/ (全量检索 "双向同步")', by: 'agent:worker', checks: [{ checker: 'agent:verifier', result: 'unresolved', note: '检索为空只能证明经验库无记录，不能证明公司从未做过，需人确认', method: '独立代理复核', correction: '' }] },
      ],
      t3: [{ claim: '质疑：基准数据来自理想化排产，客户插单频繁会怎样？ → 回应：P-2024-07 插单率 18% 场景下求解仍 < 6 分钟，已写入风险', ref: 'experience/projects/P-2024-07/复盘.md', by: 'agent:worker', checks: [{ checker: 'agent:redteam', result: 'fail', note: '基准未覆盖插单', method: '独立代理复核', correction: '' }, { checker: 'agent:redteam', result: 'pass', note: '回应充分', method: '独立代理复核', correction: '补充 P-2024-07 插单率 18% 场景数据' }] }],

// ---------- helpers ----------
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const kids = (id) => Object.values(db).filter((c) => c.parent === id);
const chip = (s, blockedType) => `<span class="chip s-${s}">${s === 'blocked' && blockedType === 'limit' ? '阻塞·已达上限' : STATUS[s]}</span>`;
const who = (a) => a === 'human'
  ? '<span class="who-human">你</span>'
  : `<span class="who-agent">${esc(a.replace('agent:', ''))}</span>`;
const stamp = () => { const d = new Date(); return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function go(page, id = null) { view = { page, id }; render(); $('main').scrollTop = 0; }
function log(c, actor, text) { c.log.push([stamp(), actor, text]); }
const VERDICT = { pass: '✓ 通过', fail: '✗ 不通过', unresolved: '? 无法判定', unchecked: '— 未检查' };
const ATTEMPT_RESULT = { success: '成功', failed: '失败', running: '进行中', limit: '达到上限' };
const list = (items) => items.length ? `<ul>${items.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '<div class="empty">暂无</div>';
const unresolvedTests = (c) => c.tests.filter((t) => t.v === 'unresolved');
function signoffBlocker(c) {
  if (unresolvedTests(c).length) return '仍有无法判定的测试，请先人工判定后签收';
  if (c.tests.some((t) => t.kind !== 'judgment' && t.v !== 'pass')) return '仍有未通过的测试，请打回后补充验证';
  return '';
}
function ensureStarted(c) {
  c.attempts ||= [];
  c.handoff ||= {
    updated: `${stamp()} · agent:chief`, baseline: '刚批准，worker 首步需读取允许资料、记录并验证基线',
    done: ['需求、边界和测试已由人确认'], decisions: ['按批准的契约执行，尚未开始验证'],
    open: ['基线和资料路径待 worker 实际核对'], next: '核对资料来源与文件，记录基线后开始执行', outputs: [],
  };
}
function updateHandoff(c, next) {
  ensureStarted(c); c.handoff.updated = `${stamp()} · human`; c.handoff.next = next;
}

function inbox() {
  const all = Object.values(db);
  return {
    drafts: all.filter((c) => c.status === 'draft' && !c.parent),
    changes: all.filter((c) => c.change),
    blocked: all.filter((c) => c.status === 'blocked'),
    review: all.filter((c) => c.status === 'in_review'),
  };
}
const inboxCount = () => { const b = inbox(); return b.drafts.length + b.changes.length + b.blocked.length + b.review.length; };

// ---------- sidebar ----------
function renderSide() {
  const node = (c, depth) => `
    <div class="tree-node ${view.page === 'contract' && view.id === c.id ? 'active' : ''}" style="padding-left:${8 + depth * 16}px" onclick="go('contract','${c.id}')">
      <span class="dot d-${c.status}"></span><span class="t">${esc(c.title)}</span>
      ${c.change ? '<span class="count" title="变更请求">1</span>' : ''}
    </div>` + kids(c.id).map((k) => node(k, depth + 1)).join('');
  const roots = Object.values(db).filter((c) => !c.parent);
  const n = inboxCount();
  $('#side').innerHTML = `
    <div class="brand">⎈ Helm <small>契约驱动的 ADE · 原型</small></div>
    <div class="nav-item ${view.page === 'inbox' ? 'active' : ''}" onclick="go('inbox')">
      <span>收件箱</span>${n ? `<span class="count">${n}</span>` : ''}
    </div>
    <div class="section-label">契约树</div>
    ${roots.map((r) => node(r, 0)).join('')}
    <div class="section-label">模板</div>
    ${templates.length ? templates.map((t) => `<div class="nav-item ${view.page === 'template' && view.id === t.id ? 'active' : ''}" onclick="go('template','${t.id}')">${esc(t.title)}</div>`).join('') : '<div class="empty" style="padding-left:10px">签收后可沉淀为模板</div>'}

}

// ---------- human actions (simulated) ----------
function approve(id) {
  const c = db[id];
  if (c.status !== 'draft') return;
  if (c.boundaries.some((b) => !b.ok)) { toast('还有边界未确认：请勾选或删除'); return; }
  const descendants = (x) => [x, ...kids(x.id).flatMap(descendants)];
  const tree = descendants(c);
  tree.forEach((x) => { x.status = 'ready'; x.boundaries.forEach((b) => (b.ok = true)); ensureStarted(x); log(x, 'human', '批准契约'); });
  log(c, 'agent:chief', '开始派单');
  c.status = 'running';
  toast(`已批准 ${tree.length} 个契约，chief 开始派单`); render();
}
function toggleBound(id, i) {
  const c = db[id]; if (c.status !== 'draft') return;
  c.boundaries[i].ok = !c.boundaries[i].ok; render();
}
function toggleMechanism() { $('#newMech').hidden = $('#boundEnf').value !== 'enforced'; }
function addBound(id) {
  const c = db[id]; if (c.status !== 'draft') return;
  const v = $('#newBound').value.trim(); if (!v) return;
  const enf = $('#boundEnf').value === 'enforced' ? 'enforced' : 'advisory';
  const mech = enf === 'enforced' ? $('#newMech').value.trim() : '';
  if (enf === 'enforced' && !mech) { toast('请填写强制边界的保证机制'); return; }
  c.boundaries.push({ text: v, src: 'human', ok: true, enf, ...(mech ? { mech } : {}) });
  log(c, 'human', `添加${enf === 'enforced' ? '强制' : '建议'}边界：${v}`); render();
}
function answer(id) {
  const c = db[id]; if (c.status !== 'blocked' || c.blockedType === 'limit') return;
  const v = $('#answer').value.trim();
  if (!v) { toast('请先输入回答'); return; }
  c.status = 'running'; delete c.question; log(c, 'human', `回答：${v}`); log(c, 'agent:worker', '继续执行');
  c.handoff.decisions.push(`人补充排期：${v}`);
  updateHandoff(c, '核对人补充的排期并继续计算可用产能');
  toast('已回答，worker 继续执行'); render();
}
function isLimitBlocked(c) { return c.status === 'blocked' && c.blockedType === 'limit'; }
function extendBudget(id) {
  const c = db[id]; if (!isLimitBlocked(c)) return;
  const before = c.limit.tokenBudget; c.limit.tokenBudget = before * 1.5; c.status = 'running';
  log(c, 'human', `追加预算：token 上限 ${before} → ${c.limit.tokenBudget}（+50%）`);
  updateHandoff(c, '核对部分报告与引用文件，在追加预算内继续未完成工作');
  c.handoff.open = c.handoff.open.filter((x) => x !== 'token 预算已全部用完');
  c.handoff.decisions.push(`人追加 token 预算至 ${c.limit.tokenBudget}，保留已用 ${c.limit.usedTokens} 的记录`);
  toast('已追加 50% token 预算，worker 继续执行'); render();
}
function adjustContract(id) {
  const c = db[id]; if (!isLimitBlocked(c)) return;
  const text = prompt('追加需求调整（例如缩小范围，保留当前部分结果）', '');
  if (text === null || !text.trim()) return;
  c.need += `\n\n契约调整：${text.trim()}`; c.version++; c.status = 'running';
  log(c, 'human', `调整契约至 v${c.version}：${text.trim()}`);
  updateHandoff(c, '按调整后的需求核对已有结果与剩余工作；达到测试或上限即停止');
  toast(`契约升至 v${c.version}，worker 继续执行`); render();
}
function abandon(id) {
  const c = db[id]; if (!isLimitBlocked(c)) return;
  c.status = 'abandoned'; log(c, 'human', '终止契约：达到上限后保留部分完成结果');
  updateHandoff(c, '已终止，保留产出与未解决问题供后续参考');
  toast('契约已终止'); render();
}
function decide(id, ok) {
  const c = db[id]; const ch = c.change; if (!ch) return;
  if (ok) {
    ch.add.forEach((t) => c.boundaries.push({ text: t, src: 'agent_draft', ok: true, enf: 'advisory', why: '经你批准的变更请求' }));
    c.version++;
  }
  log(c, 'human', `${ok ? '批准' : '驳回'}变更请求`); delete c.change;
  toast(ok ? `边界已更新，契约升至 v${c.version}` : '已驳回，代理按原契约继续'); render();
}
function resolveTest(id, testId, pass, actor = 'human') {
  const c = db[id]; const t = c.tests.find((x) => x.id === testId);
  if (actor !== 'human') { toast('无法判定的测试只能由人判定'); return; }
  if (c.status !== 'in_review' || !t || t.v !== 'unresolved' || typeof pass !== 'boolean') return;
  const check = { checker: 'human', result: pass ? 'pass' : 'fail', note: `由你将「${t.text}」判为${pass ? '通过' : '不通过'}`, method: '人工判定', correction: '' };
  const ev = c.evidence[t.id] || [];
  const pending = ev.filter((e) => e.checks[e.checks.length - 1]?.result === 'unresolved');
  if (pending.length) pending.forEach((e) => e.checks.push({ ...check }));
  else if (ev.length) ev[0].checks.push(check);
  else { t.checks ||= []; t.checks.push(check); }
  t.v = check.result; log(c, 'human', `${t.id} 人工判为${pass ? '通过' : '不通过'}`);
  toast(pass ? '已记录人工判定：通过' : '已记录人工判定：不通过，可打回补充'); render();
}
function signoff(id, ok) {
  const c = db[id]; if (c.status !== 'in_review') return;
  const blocker = signoffBlocker(c);
  if (ok && blocker) { toast(blocker); return; }
  const note = prompt(ok ? '签收备注（可选）' : '打回原因（必填）', '');
  if (note === null || (!ok && !note.trim())) return;
  c.signNote = note;
  c.tests.filter((t) => t.kind === 'judgment').forEach((t) => {
    t.v = ok ? 'pass' : 'fail'; t.checks ||= [];
    t.checks.push({ checker: 'human', result: t.v, note: note || '人工签收确认', method: '人工判定', correction: '' });
  });
  c.status = ok ? 'accepted' : 'changes_requested';
  log(c, 'human', ok ? '签收' : `打回：${note}`);
  if (ok && c.parent) log(db[c.parent], 'agent:chief', `子契约「${c.title}」已签收`);
  toast(ok ? '已签收' : '已打回'); render();
}
function saveTemplate(id) {
  const c = db[id]; if (c.status !== 'accepted') return;
  if (templates.some((t) => t.sourceId === id)) { toast('此契约已保存为模板'); return; }
  const title = prompt('模板名称', c.title);
  if (title === null) return;
  if (!title.trim()) { toast('请输入模板名称'); return; }
  templates.push({
    id: `tpl${templates.length + 1}`, sourceId: id, sourceVersion: c.version, title: title.trim(), need: c.need,
    boundaries: c.boundaries.map((b) => ({ ...b })),
    tests: c.tests.map(({ id, kind, text }) => ({ id, kind, text })), children: kids(id).map((x) => x.title),
  });
  log(c, 'human', `保存为模板「${title.trim()}」`); toast('模板已保存到侧栏'); render();
}

// ---------- worker startup prompt ----------
function workerPrompt(id) {
  const c = db[id]; const l = c.limit; const h = c.handoff;
  const checks = c.tests.map((t) => `${t.id} [${KIND[t.kind]}] ${t.text}`).join('\n');
  const scope = c.boundaries.map((b) => `${b.enf === 'enforced' ? '[强制]' : '[建议]'} ${b.text}${b.enf === 'enforced' ? `（机制：${b.mech}）` : '（verifier 核对）'}`).join('\n') || '无额外边界';
  const failed = (c.attempts || []).filter((a) => a.result === 'failed').map((a) => `#${a.number} ${a.actor} · ${a.model}；方法：${a.method}；失败原因：${a.failure}；${a.tokens} token，耗时 ${a.duration}`).join('\n') || '暂无失败尝试';
  const handoff = h ? `更新：${h.updated}\n基线：${h.baseline}\n已完成：${h.done.join('；') || '暂无'}\n决策及依据：${h.decisions.join('；') || '暂无'}\n未解决：${h.open.join('；') || '暂无'}\n下一步：${h.next}\n产出路径：${h.outputs.join('；') || '暂无'}` : '尚未开工，无交接记录；第一步记录基线';
  return `<goal>完成 ${c.need}。在 ${c.deliverable} 留下可用结果、验证证据和交接记录。达到全部测试或上限即停止。</goal>
<inputs>
Task: ${c.need}
Output: ${c.deliverable}
Checks: ${checks}
Sources: ${c.sources.join('；')}
Scope: ${scope}
Limit: 截止 ${l.deadline} / 尝试次数 ${l.usedAttempts}/${l.maxAttempts} / token ${l.usedTokens}/${l.tokenBudget}
Handoff:
${handoff}
</inputs>
<rules>
- 先读 handoff，再核对其引用的文件，不要直接相信记录的状态
- 第一步记录基线
- 不得放宽测试来换取通过；契约问题只能通过 propose_change 提出
- 不得重复已失败的方法，除非有新理由（失败记录摘要：
${failed}）
- 每完成一个阶段调用 save_handoff
- 证据通过 submit_evidence 提交；验证由 verifier 完成，你不自评
</rules>`;
}
function openWorkerPrompt(id) {
  modalContract = id; modalReturnFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="modal-backdrop" onclick="if(event.target === this) closeWorkerPrompt()"><div class="card modal" role="dialog" aria-modal="true" aria-labelledby="prompt-title">
    <h2 id="prompt-title">worker 启动 prompt · ${esc(db[id].title)}<button id="close-prompt" class="small" onclick="closeWorkerPrompt()">关闭</button></h2>
    <pre class="prompt-preview">${esc(workerPrompt(id))}</pre><div class="actions"><button id="copy-prompt" class="primary" onclick="copyWorkerPrompt()">复制</button></div>
  </div></div>`;
  $('#close-prompt').focus?.();
}
function closeWorkerPrompt() {
  modalContract = null; $('#modal-root').innerHTML = ''; modalReturnFocus?.focus?.(); modalReturnFocus = null;
}
async function copyWorkerPrompt() {
  if (!modalContract) return;
  try { await navigator.clipboard.writeText(workerPrompt(modalContract)); toast('已复制'); }
  catch { toast('复制失败'); }
}
if (typeof document.addEventListener === 'function') document.addEventListener('keydown', (event) => {
  if (!modalContract) return;
  if (event.key === 'Escape') { event.preventDefault(); closeWorkerPrompt(); }
  if (event.key === 'Tab') {
    const first = $('#close-prompt'); const last = $('#copy-prompt');
    if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
    else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
  }
});

function render() {
  renderSide();
  if (view.page === 'inbox') renderInbox();
  else if (view.page === 'template') renderTemplate(templates.find((t) => t.id === view.id));
  else renderContract(db[view.id]);
}
window.helm = { db, templates, inbox, approve, toggleBound, decide, signoff, extendBudget, adjustContract, abandon, resolveTest, saveTemplate, workerPrompt, go, addBound, answer, openWorkerPrompt, closeWorkerPrompt, copyWorkerPrompt };
render();
</script>
